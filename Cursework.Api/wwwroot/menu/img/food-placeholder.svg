  <!-- Иконка тарелки -->
  <circle cx="160" cy="90" r="32" fill="#fafafa" stroke="#e0e0e0" stroke-width="2"/>
  <circle cx="160" cy="90" r="18" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Вилка -->
  <rect x="140" y="72" width="4" height="28" rx="1.5" fill="#c4c4c4"/>
